function zcParseSearch(rawName,rawSet,rawNumber){
  const explicitSet=zcClean(rawSet);
  const explicitNumber=zcClean(rawNumber).toUpperCase();
  const rawNameClean=zcClean(rawName);

  let setQuery=explicitSet;
  let number=/^(?:TG|GG|SV)?[A-Z]*\d{1,4}[A-Z]*$/i.test(explicitNumber)?explicitNumber:'';
  let name=rawNameClean;

  // When users put a complete search in the name field, understand:
  // "FST 100", "SVP 036", "sv2a 205", "Charizard SVP 075", "GG21", etc.
  if(!explicitSet && !explicitNumber && rawNameClean){
    const tokens=rawNameClean.split(/\s+/).filter(Boolean);
    const rest=[];
    for(const token of tokens){
      const u=token.toUpperCase();

      if(!number && /^(?:TG|GG|SV)?[A-Z]*\d{1,4}[A-Z]*$/i.test(token)){
        number=u;
        continue;
      }

      // A token that contains letters + digits (sv2a, s12a, sv10.5b) is likely a set id.
      if(!setQuery && /^(?=.*[A-Z])(?=.*\d)[A-Z0-9.:-]{2,12}$/i.test(token) && !/^(?:TG|GG|SV)\d+/i.test(token)){
        setQuery=token;
        continue;
      }

      // 2-6 letter uppercase token can be a Western set/promo code.
      if(!setQuery && /^[A-Z]{2,6}$/.test(u) && tokens.length>1){
        setQuery=token;
        continue;
      }

      rest.push(token);
    }
    name=rest.join(' ');
  }

  // Only split if the left part is alphabetic and the right part is a valid card number.
  if(explicitSet && !number){
    const compact=explicitSet.match(/^([A-Za-z]{2,8})((?:TG|GG|SV)?\d{1,4}[A-Za-z]?)$/);
    if(compact){
      setQuery=compact[1];
      number=compact[2].toUpperCase();
    }
  }

    name:zcClean(name),
    setQuery:zcClean(setQuery),
    setCode:zcClean(setQuery).toUpperCase(),
    setId:SET_CODE_TO_ID[zcClean(setQuery).toUpperCase()]||'',
    number:zcClean(number),
    preferredLang:null,
    pokemonSetId:''
  };
}

    return Number.isFinite(base)&&base>0?base:null;
  };
  const current=zcMedian([
    pick('trend-holo','trend'),
    pick('avg1-holo','avg1'),
    pick('avg7-holo','avg7')
  ]);
  const lowRaw=isFoil?(p['low-holo']??p.low):p.low;
  const low=Number(lowRaw);
  if(!Number.isFinite(low)||low<=0)return current;
  if(current==null)return low;
  // Gebruik de laagste marktprijs wanneer die geloofwaardig is. Een extreem
  // lage fout-, damaged- of lokaanbieding mag de richtprijs niet bepalen.
  return low>=current*.60?(Math.min(low,current)+current)/2:current;
}

function zcNormText(v=''){
  return String(v).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'')
    .replace(/[^a-z0-9]+/g,' ').trim();
}
function zcNormCardNumber(v=''){
  return String(v).toUpperCase().replace(/\s+/g,'').replace(/^0+(?=\d)/,'');
}
function zcExactIdentityMatch(base,candidate){
  if(!base||!candidate)return false;
  const nameOK=zcNormText(base.name)===zcNormText(candidate.name);
  const numOK=zcNormCardNumber(base.number||base.localId)===zcNormCardNumber(candidate.number||candidate.localId);
  const setA=zcNormText(base.set||base.setName||'');
  const setB=zcNormText(candidate.set||candidate.setName||candidate.set?.name||'');
  const setOK=!setA||!setB||setA===setB;
  return nameOK&&numOK&&setOK;
}
function zcMedian(values){
  const a=values.filter(v=>Number.isFinite(Number(v))&&Number(v)>0).map(Number).sort((a,b)=>a-b);
  if(!a.length)return null;
  const m=Math.floor(a.length/2);
  return a.length%2?a[m]:(a[m-1]+a[m])/2;
}
function zcRejectOutlier(primary, comparisons=[]){
  const p=Number(primary);
  const refs=comparisons.filter(v=>Number.isFinite(Number(v))&&Number(v)>0).map(Number);
  if(!Number.isFinite(p)||p<=0)return null;
  if(!refs.length)return p;
  const med=zcMedian(refs);
  if(!med)return p;
  const ratio=Math.max(p/med,med/p);
  // Very strict: reject if > 2.25x away from the median of other sources.
  return ratio>2.25?null:p;
}
function zcSafeAvg30(card,selectedVariant){
  const exact=zcAvg30ForSelection(card,selectedVariant);
  if(exact==null)return null;

  // Compare against any fallback marketplace values we already have on the card object.
  const refs=[];
  if(Number.isFinite(Number(card?.tcgplayerMarket)))refs.push(Number(card.tcgplayerMarket));
  if(Number.isFinite(Number(card?.fallbackMarket)))refs.push(Number(card.fallbackMarket));
  if(Array.isArray(card?.marketComparisons)){
    for(const v of card.marketComparisons)if(Number.isFinite(Number(v)))refs.push(Number(v));
  }

  return zcRejectOutlier(exact,refs);
}
function zcAvg30ForSelection(card,selectedVariant){
  const variants=card?.variantsDetailed||[];
  const wanted=selectedVariant||'Automatisch';

  if(wanted==='Automatisch'){
    // Prefer a variant-specific price if the source explicitly supplies it.
    for(const variant of variants){
      const isFoil=variant.type!=='normal'||!!variant.foil;
      const price=zcAvg30FromPricing(variant.pricing,isFoil);
      if(price!=null)return price;
    }
    // Otherwise use the regular card-level 30-day average.
    return zcAvg30FromPricing(card?.tcgdexPricing,false) ?? zcAvg30FromPricing(card?.tcgdexPricing,true);
  }

  const exact=variants.find(v=>zcFinishLabel(v)===wanted);
  if(exact){
    const isFoil=exact.type!=='normal'||!!exact.foil;
    const price=zcAvg30FromPricing(exact.pricing,isFoil);
    if(price!=null)return price;
  }

  const foilWanted=!['Basic / Normaal','Standard'].includes(wanted);
  return zcAvg30FromPricing(card?.tcgdexPricing,foilWanted);
}
function zcIsNamedSpecialVariant(value=''){
  const v=zcNormText(value);
  return ['poke ball','great ball','master ball','pokemon together stamp','snowflake stamp','play pokemon stamp','pokemon center stamp','prerelease stamp','staff stamp'].includes(v);
}
function zcSyncVariantOptions(card){

  const supported=new Set([

  ]);
  for(const option of select.options){
    option.disabled=zcIsNamedSpecialVariant(option.value)&&!supported.has(option.value);
  }
  if(zcIsNamedSpecialVariant(select.value)&&!supported.has(select.value)){
    select.value='Automatisch';
    showToast('Deze speciale uitvoering bestaat niet voor de gevonden kaart. Automatisch is geselecteerd.');
  }
}
function zcCurrentMarketForSelection(card,selectedVariant){
  const variants=card?.variantsDetailed||[];
  const wanted=selectedVariant||'Automatisch';
  if(wanted==='Automatisch'){
    for(const variant of variants){
      const price=zcCurrentMarketFromPricing(variant.pricing,variant.type!=='normal'||!!variant.foil);
      if(price!=null)return price*.97;
    }
    const price=zcCurrentMarketFromPricing(card?.tcgdexPricing,false) ?? zcCurrentMarketFromPricing(card?.tcgdexPricing,true);
    return price==null?null:price*.97;
  }
  const exact=variants.find(v=>zcFinishLabel(v)===wanted);
  if(exact){
    const price=zcCurrentMarketFromPricing(exact.pricing,exact.type!=='normal'||!!exact.foil);
    if(price!=null)return price*.97;
  }
  if(zcIsNamedSpecialVariant(wanted))return null;
  const price=zcCurrentMarketFromPricing(card?.tcgdexPricing,!['Basic / Normaal','Standard'].includes(wanted));
  return price==null?null:price*.97;
}

function zcTcgplayerVariantBlock(pricing,selectedVariant='Standard'){

  const keys= wanted==='standard'
    ? ['normal','holofoil','reverseHolofoil','1stEdition']
    : wanted.includes('reverse')
      ? ['reverseHolofoil','holofoil','normal']
      : ['holofoil','reverseHolofoil','normal'];
  for(const k of keys){if(p[k]&&typeof p[k]==='object')return p[k]}
  return null;
}

}

async function zcFetchJson(url,timeout=9000){
  const ctrl=new AbortController(),timer=setTimeout(()=>ctrl.abort(),timeout);
  try{
    const r=await fetch(url,{headers:{Accept:'application/json'},signal:ctrl.signal,cache:'no-store'});
    if(!r.ok)throw new Error(`HTTP ${r.status}`);
    return await r.json()
  }finally{clearTimeout(timer)}
}
async function zcTcgdexCardById(setId,number){
  if(!setId||!number)return null;
  const raw=String(number).trim();
  const variants=[raw,raw.toUpperCase(),zcNormNumber(raw)];

  if(/^\d+$/.test(raw)){
    const plain=String(parseInt(raw,10));
    variants.push(plain,plain.padStart(3,'0'));

    // Promo sets before Scarlet & Violet use the era prefix in their local card ID.
    const promoPrefix={
      swshp:'SWSH',
      smp:'SM',
      xyp:'XY',
      bwp:'BW',
      dpp:'DP',
      np:'NP'
    }[String(setId).toLowerCase()];

    if(promoPrefix){
      variants.push(
        promoPrefix+plain,
        promoPrefix+plain.padStart(2,'0'),
        promoPrefix+plain.padStart(3,'0')
      );
    }
  }

  const tried=new Set();
  for(const n of variants){
    if(!n||tried.has(n))continue;
    tried.add(n);

    for(const lang of zcLanguageChain()){
      try{
        const c=await zcFetchJson(`https://api.tcgdex.net/v2/${lang}/cards/${encodeURIComponent(setId+'-'+n)}`);
        if(c?.id){c.__zcLang=lang;return c}
      }catch(e){}
    }
  }
  return null
}

async function zcTcgdexSearch(parsed,rarity){
  const out=[];
  // Fast/reliable path for e.g. FST 100, ASR TG14, BRS TG08.
  if(parsed.setId&&parsed.number){
    const c=await zcTcgdexCardById(parsed.setId,parsed.number);
    if(c){
      const nameOK=!parsed.name||(c.name||'').toLowerCase().includes(parsed.name.toLowerCase());
      const rarityOK=!rarity||(c.rarity||'').toLowerCase()===rarity.toLowerCase();
      if(nameOK&&rarityOK)return[zcTcgdexToResult(c)]
    }
  }
  // When a set is known, load that set's card list and filter locally.
  if(parsed.setId){
    const s=await zcTcgdexSet(parsed.setId);
    if(s?.cards?.length){
      let list=s.cards.filter(c=>{
        const numOK=!parsed.number||zcNormNumber(c.localId||'')===zcNormNumber(parsed.number);
        const nameOK=!parsed.name||(c.name||'').toLowerCase().includes(parsed.name.toLowerCase());
        return numOK&&nameOK
      }).slice(0,18);
      for(const brief of list){
        const full=await zcTcgdexFullCard(brief.id)||brief;
        if(!rarity||(full.rarity||'').toLowerCase()===rarity.toLowerCase())out.push(zcTcgdexToResult({...full,set:full.set||s}))
      }
      if(out.length)return out
    }
  }
  // Generic name/number search.
  const searches=[];
  const addSearch=(name,number)=>{
    const params=new URLSearchParams();
    if(name)params.set('name',name);
    if(number)params.set('localId',number);
    params.set('pagination:page','1');
    params.set('pagination:itemsPerPage','60');
    searches.push(params.toString());
  };

  addSearch(parsed.name,parsed.number);

  if(parsed.number && /^(?:TG|GG|SV)\d+/i.test(parsed.number)){
    addSearch('',parsed.number);
  }

  for(const qs of [...new Set(searches)]){
    try{
      let list=null,usedLang=null;
      for(const lang of zcLanguageChain()){
        try{
          const candidate=await zcFetchJson(`https://api.tcgdex.net/v2/${lang}/cards?${qs}`);
          if(Array.isArray(candidate)&&candidate.length){list=candidate;usedLang=lang;break}
        }catch(e){}
      }
      if(Array.isArray(list)){
        for(const brief of list.slice(0,30)){
          const full=await zcTcgdexFullCard(brief.id,usedLang)||brief;
          if(parsed.number&&zcNormNumber(full.localId||'')!==zcNormNumber(parsed.number))continue;
          if(parsed.name&&!(full.name||'').toLowerCase().includes(parsed.name.toLowerCase()))continue;
          if(rarity&&(full.rarity||'').toLowerCase()!==rarity.toLowerCase())continue;
          if(!out.some(x=>x.id===full.id))out.push(zcTcgdexToResult(full));
          if(out.length>=18)break;
        }
      }
    }catch(e){}
    if(out.length>=18)break;
  }
  return out
}
async function zcPokemonFallback(parsed,rarity){
  const attempts=[];
  // PokemonTCG IDs differ slightly for special sets, so use current identifiers where known.
  const pokeIds={...SET_CODE_TO_ID,SHF:'swsh45',CPA:'swsh35',CRZ:'swsh12pt5',PAL:'sv2',OBF:'sv3',MEW:'sv3pt5',PAR:'sv4',PAF:'sv4pt5',TEF:'sv5',TWM:'sv6',SFA:'sv6pt5',SCR:'sv7',SSP:'sv8',PRE:'sv8pt5'};
  // Een dynamisch opgeloste setcode (bijv. BRS -> swsh9) moet altijd als
  // harde setvoorwaarde worden meegestuurd. Zonder dit viel de zoekopdracht
  // terug op alleen de kaartnaam en verschenen kaarten uit andere sets.
  const sid=parsed.pokemonSetId||parsed.setId||pokeIds[parsed.setCode]||'';
  if(sid&&parsed.number&&parsed.name)attempts.push(`set.id:${sid} number:${parsed.number} name:${parsed.name}*`);
  if(sid&&parsed.number)attempts.push(`set.id:${sid} number:${parsed.number}`);
  if(sid&&parsed.name)attempts.push(`set.id:${sid} name:${parsed.name}*`);
  if(parsed.number&&parsed.name)attempts.push(`number:${parsed.number} name:${parsed.name}*`);
  if(parsed.number)attempts.push(`number:${parsed.number}`);
  if(parsed.name)attempts.push(`name:${parsed.name}*`);
  const seen=new Map();
  for(const q of attempts){
    try{
      const u=`https://api.pokemontcg.io/v2/cards?q=${encodeURIComponent(q)}&orderBy=-set.releaseDate,number&pageSize=40`;
      const d=await zcFetchJson(u);
      for(const c of d.data||[]){
        if(sid&&c.set?.id!==sid)continue;
        if(parsed.number&&zcNormNumber(c.number)!==zcNormNumber(parsed.number))continue;
        if(parsed.name&&!c.name.toLowerCase().includes(parsed.name.toLowerCase()))continue;
        if(rarity&&(c.rarity||'').toLowerCase()!==rarity.toLowerCase())continue;
        seen.set(c.id,c)
      }
    }catch(e){}
    if(seen.size)break
  }
  return[...seen.values()].slice(0,18).map(zcPokeToResult)
}

const ZC_CATALOG_KEY='zamexcards_global_set_catalog_v12';
const ZC_CATALOG_TTL=12*60*60*1000;
const ZC_ALL_TCGDEX_LANGS=['en','ja','zh-tw','zh-cn','ko','de','fr','it','es','pt','nl'];
let ZC_GLOBAL_CATALOG=[];
let ZC_CATALOG_PROMISE=null;

function zcCatalogNorm(v=''){
  return String(v).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'')
    .replace(/[^a-z0-9]+/g,' ').trim();
}
function zcCatalogAliases(entry){

    entry.id,
    entry.name,
    entry.ptcgoCode,
    ...(entry.aliases||[])
  ].filter(Boolean).map(v=>String(v).trim()))];

function zcTcgdexIdFromPokemonId(value=''){
  const id=String(value||'').trim();
  let m=id.match(/^me(\d+)(.*)$/i);
  if(m)return `me${m[1].padStart(2,'0')}${m[2]||''}`;
  m=id.match(/^sv(\d+)pt5(.*)$/i);
  if(m)return `sv${m[1].padStart(2,'0')}.5${m[2]||''}`;
  m=id.match(/^sv(\d+)(.*)$/i);
  if(m)return `sv${m[1].padStart(2,'0')}${m[2]||''}`;
  m=id.match(/^swsh(\d+)pt5(.*)$/i);
  if(m)return `swsh${m[1]}.5${m[2]||''}`;
  return id;
}
function zcMergeCatalogEntry(map,entry){
  const key=`${entry.lang||'x'}|${entry.id||entry.name}`;
  const old=map.get(key);
  if(!old){map.set(key,entry);return}
  old.aliases=[...new Set([...(old.aliases||[]),...(entry.aliases||[])])];
  if(!old.ptcgoCode&&entry.ptcgoCode)old.ptcgoCode=entry.ptcgoCode;
  if(!old.releaseDate&&entry.releaseDate)old.releaseDate=entry.releaseDate;
  if(!old.series&&entry.series)old.series=entry.series;
  if(!old.code&&entry.code)old.code=entry.code;
}
async function zcLoadGlobalCatalog(force=false){
  if(ZC_CATALOG_PROMISE&&!force)return ZC_CATALOG_PROMISE;
  ZC_CATALOG_PROMISE=(async()=>{
    if(!force){
      try{
        const cached=JSON.parse(localStorage.getItem(ZC_CATALOG_KEY)||'null');
        if(cached?.at && Array.isArray(cached.items) && cached.items.length>20 && Date.now()-cached.at<ZC_CATALOG_TTL){
          ZC_GLOBAL_CATALOG=cached.items;
          return ZC_GLOBAL_CATALOG;
        }
      }catch(e){}
    }

    const map=new Map();

    // TCGdex: load every available language/region. Failed language endpoints are simply skipped.
    await Promise.all(ZC_ALL_TCGDEX_LANGS.map(async lang=>{
      try{
        const sets=await zcFetchJson(`https://api.tcgdex.net/v2/${lang}/sets`,9000);
        if(Array.isArray(sets)){
          for(const s of sets){
            if(!s?.id)continue;
            zcMergeCatalogEntry(map,{
              source:'tcgdex',
              lang,
              id:String(s.id),
              name:String(s.name||s.id),
              series:String(s.serie?.name||s.series?.name||s.serie||s.series||''),
              releaseDate:s.releaseDate||s.release_date||'',
              code:String(s.code||s.setCode||s.abbreviation||s.printedCode||''),
              aliases:[
                String(s.id||''),
                String(s.name||''),
                String(s.code||''),
                String(s.setCode||''),
                String(s.abbreviation||''),
                String(s.printedCode||'')
              ].filter(Boolean)
            });
          }
        }
      }catch(e){}
    }));

    // De officiële openbare setdata voegt alle Engelse setcodes en releasedata toe.
    // Dit bronbestand ondersteunt rechtstreeks browsergebruik op GitHub Pages.
    try{
      const d=await zcFetchJson('https://raw.githubusercontent.com/PokemonTCG/pokemon-tcg-data/master/sets/en.json',12000);
      for(const s of Array.isArray(d)?d:[]){
        zcMergeCatalogEntry(map,{
          source:'pokemontcg',
          lang:'en',
          id:String(s.id||''),
          name:String(s.name||s.id||''),
          series:String(s.series||''),
          ptcgoCode:String(s.ptcgoCode||''),
          releaseDate:s.releaseDate||'',
          aliases:[s.id,s.name,s.ptcgoCode].filter(Boolean).map(String)
        });
      }
    }catch(e){}

    // Belangrijkste promo-series blijven altijd beschikbaar, ook wanneer een
    // externe catalogus tijdelijk niet bereikbaar is.
    [
      ['mep','Mega Evolution Black Star Promos','Mega Evolution','MEP'],
      ['svp','Scarlet & Violet Black Star Promos','Scarlet & Violet','SVP'],
      ['swshp','SWSH Black Star Promos','Sword & Shield','SWSH'],
      ['smp','SM Black Star Promos','Sun & Moon','SM'],
      ['xyp','XY Black Star Promos','XY','XY'],
      ['bwp','BW Black Star Promos','Black & White','BW'],
      ['dpp','DP Black Star Promos','Diamond & Pearl','DP'],
      ['np','Nintendo Black Star Promos','EX','NP']
    ].forEach(([id,name,series,ptcgoCode])=>zcMergeCatalogEntry(map,{source:'fallback',lang:'en',id,name,series,ptcgoCode,releaseDate:'',aliases:[id,name,ptcgoCode]}));

    ZC_GLOBAL_CATALOG=[...map.values()];
    try{localStorage.setItem(ZC_CATALOG_KEY,JSON.stringify({at:Date.now(),items:ZC_GLOBAL_CATALOG}))}catch(e){}
    return ZC_GLOBAL_CATALOG;
  })();
  try{return await ZC_CATALOG_PROMISE}
  finally{ZC_CATALOG_PROMISE=null}
}

function zcPrimarySetLanguages(){
  const lang=zcSelectedLanguage();
  if(lang==='English')return ['en'];
  if(lang==='Japanese')return ['ja'];
  if(lang==='Chinese')return ['zh-cn','zh-tw'];
  if(lang==='Korean')return ['ko'];
  if(lang==='German')return ['de'];
  if(lang==='French')return ['fr'];
  if(lang==='Italian')return ['it'];
  if(lang==='Spanish')return ['es'];
  if(lang==='Dutch')return ['nl'];
  return ['en'];
}
function zcDateValue(v){const t=Date.parse(String(v||''));return Number.isFinite(t)?t:0}
function zcIsPromoSet(entry){
  const id=String(entry?.id||'').toLowerCase();
  const code=String(entry?.ptcgoCode||entry?.code||'').toUpperCase();
  const name=zcCatalogNorm(entry?.name||'');
  const knownIds=['mep','svp','swshp','smp','xyp','bwp','dpp','np','basep','miscp'];
  const knownCodes=['MEP','SVP','SWSH','SM','XY','BW','DP','NP'];
  return knownIds.includes(id)||knownCodes.includes(code)||
    /promo|promotional|black star|pop series|mcdonald|trainer kit|futsal|sample|demo pack/.test(name)||
    /^(pop\d+|tk\d+|mcd\d+)$/.test(id);
}
function zcIsReleasedSet(entry){
  const t=zcDateValue(entry?.releaseDate);
  if(!t)return true;
  const endToday=new Date();endToday.setHours(23,59,59,999);
  return t<=endToday.getTime();
}
function zcOfficialEnglishSetEntry(entry){
  if(!entry)return null;
  if(entry.source==='pokemontcg'&&entry.ptcgoCode)return entry;

  const nameKey=zcCatalogNorm(entry.name||'');
  const idKey=String(entry.id||'').toLowerCase();

  // Match the same set from Pokémon TCG API, which exposes the official PTCGO code.
  let official=ZC_GLOBAL_CATALOG.find(e=>
    e.source==='pokemontcg' &&
    e.ptcgoCode &&
    (
      (nameKey && zcCatalogNorm(e.name||'')===nameKey) ||
      String(e.id||'').toLowerCase()===idKey
    )
  );

  // A few sources can vary slightly in punctuation/subtitles.
  if(!official && nameKey){
    official=ZC_GLOBAL_CATALOG.find(e=>{
      if(e.source!=='pokemontcg'||!e.ptcgoCode)return false;
      const n=zcCatalogNorm(e.name||'');
      return n===nameKey || (n.length>4 && nameKey.length>4 && (n.includes(nameKey)||nameKey.includes(n)));
    });
  }

  return official||null;
}

function zcEnglishCodeForSet(entry){
  const official=zcOfficialEnglishSetEntry(entry);
  if(official?.ptcgoCode)return String(official.ptcgoCode).toUpperCase();

  // Promo aliases where the database set ID is more useful than a non-existing PTCGO code.
  const promoAliases={
    mep:'MEP',
    svp:'SVP',
    swshp:'SWSH',
    smp:'SM',
    xyp:'XY',
    bwp:'BW',
    dpp:'DP',
    np:'NP'
  };
  const id=String(entry?.id||'').toLowerCase();
  if(promoAliases[id])return promoAliases[id];

  return String(entry?.ptcgoCode||entry?.id||'').toUpperCase();
}
function zcRegionalSetCode(entry){
  if(!entry)return '';

  const lang=zcSelectedLanguage();

  if(lang==='English')return zcEnglishCodeForSet(entry);

  // TCGdex regional set IDs normally match the printed/collector set code
  // for Japanese, Chinese and Korean releases (e.g. sv2a, s12a).
  // Prefer an explicit source code if the API exposes one.
  const explicit=String(
    entry.code ||
    entry.setCode ||
    entry.abbreviation ||
    entry.printedCode ||
    ''
  ).trim();

  if(explicit)return explicit;

  // For non-English sets, the TCGdex set ID is the best canonical code fallback.
  return String(entry.id||entry.name||'').trim();
}

function zcSetChoiceValue(entry){
  return zcRegionalSetCode(entry);
}
function zcSetDropdownItems(){
  const langs=zcPrimarySetLanguages();
  let entries=ZC_GLOBAL_CATALOG.filter(e=>langs.includes(e.lang)&&zcIsReleasedSet(e));
  const byName=new Map();
  for(const e of entries){
    const key=zcCatalogNorm(e.name||e.id);
    const old=byName.get(key);
    if(!old){byName.set(key,e);continue}
    if(zcSelectedLanguage()==='English'){
      // Prefer the record carrying an official PTCGO setcode.
      const eHasCode=!!zcOfficialEnglishSetEntry(e)?.ptcgoCode;
      const oldHasCode=!!zcOfficialEnglishSetEntry(old)?.ptcgoCode;
      if((eHasCode&&!oldHasCode) || (e.source==='pokemontcg'&&old.source!=='pokemontcg'))byName.set(key,e);
    }else if(e.source==='tcgdex'&&old.source!=='tcgdex')byName.set(key,e);
  }
  entries=[...byName.values()];

  // Sorteer strikt op releasedatum:
  // nieuwste bovenaan, oudste onderaan.
  // Sets zonder releasedatum (bijv. sommige promo/special sets)
  // komen na de sets met een bekende releasedatum.
  entries.sort((a,b)=>{
    const promoOrder=Number(zcIsPromoSet(a))-Number(zcIsPromoSet(b));
    if(promoOrder)return promoOrder;
    const da=zcDateValue(a.releaseDate);
    const db=zcDateValue(b.releaseDate);

    if(db && da && db!==da)return db-da;
    if(db && !da)return 1;
    if(!db && da)return -1;

    const seriesOrder=(Number(b.seriesIndex)||0)-(Number(a.seriesIndex)||0);
    if(seriesOrder)return seriesOrder;
    const setOrder=(Number(b.setIndex)||0)-(Number(a.setIndex)||0);
    if(setOrder)return setOrder;
    return String(b.id||b.name||'').localeCompare(
      String(a.id||a.name||''),
      undefined,
      {numeric:true,sensitivity:'base'}
    );
  });

  return entries;
}

  const items=zcSetDropdownItems();

  const option=e=>{
    let code=zcSetChoiceValue(e);if(zcSelectedLanguage()==='English')code=String(code).toUpperCase();
    const date=e.releaseDate?` – ${new Date(e.releaseDate).toLocaleDateString('nl-NL')}`:'';
    return `<option value="${esc(code)}">${esc(e.name||e.id)} (${esc(code)})${esc(date)}</option>`;
  };
  select.innerHTML='<option value="">Alle series</option>'+
    (regular.length?`<optgroup label="Sets – nieuwste bovenaan">${regular.map(option).join('')}</optgroup>`:'')+
    (promos.length?`<optgroup label="Promo sets">${promos.map(option).join('')}</optgroup>`:'');
  if([...select.options].some(o=>o.value===previous))select.value=previous;
}
function zcRenderSetDropdown(){
  const box=$('setDropdown'),input=$('set');if(!box||!input)return;
  const q=zcCatalogNorm(input.value||''),raw=String(input.value||'').trim().toUpperCase();
  let items=zcSetDropdownItems();
  if(q){
    items=items.filter(e=>{
      const code=String(zcSetChoiceValue(e)||'').toUpperCase();
      const official=zcSelectedLanguage()==='English'?zcOfficialEnglishSetEntry(e):null;
      const officialCode=String(official?.ptcgoCode||'').toUpperCase();

      return code.includes(raw) ||
        officialCode.includes(raw) ||
        zcCatalogNorm(e.name||'').includes(q) ||
        zcCatalogAliases(e).some(a=>String(a).toUpperCase().includes(raw) || zcCatalogNorm(a).includes(q));
    });

    // Exact setcode wins for every language.
    // Examples: BRS, sv2a, s12a, regional Chinese/Korean codes.
    const exact=items.filter(e=>{
      const code=String(zcSetChoiceValue(e)||'').toUpperCase();
      const aliases=zcCatalogAliases(e).map(a=>String(a).toUpperCase());
      const official=zcSelectedLanguage()==='English'?zcOfficialEnglishSetEntry(e):null;
      const officialCode=String(official?.ptcgoCode||'').toUpperCase();
      return code===raw || officialCode===raw || aliases.includes(raw);
    });
    if(exact.length)items=exact;
  }
  items=items.slice(0,400);
  box.innerHTML=items.length?items.map(e=>{
    let code=zcSetChoiceValue(e);
    if(zcSelectedLanguage()==='English')code=String(code).toUpperCase();
    const date=e.releaseDate?new Date(e.releaseDate).toLocaleDateString('nl-NL'):'Promo / special';
    return `<div class="set-option" role="option" data-value="${esc(code)}" data-name="${esc(e.name||'')}">
      <div><strong>${esc(e.name||e.id)}</strong><small>${esc(date)}</small></div>
      <div class="set-option-code">${esc(code)}</div>
    </div>`;
  }).join(''):'<div class="set-empty">Geen uitgebrachte sets gevonden voor deze taal.</div>';
  box.classList.add('open');input.setAttribute('aria-expanded','true');
}
function zcCloseSetDropdown(){const box=$('setDropdown'),input=$('set');if(box)box.classList.remove('open');if(input)input.setAttribute('aria-expanded','false')}
async function zcOpenSetDropdown(){

async function zcResolveSetFromCatalog(query,cardNumber=''){
  const q=zcClean(query);
  if(!q)return null;
  const qn=zcCatalogNorm(q);
  const qu=q.toUpperCase();

  const direct=ZC_SET_CROSSWALK[qu];
  if(direct?.length){
    const prefix=String(cardNumber||'').toUpperCase().match(/^(TG|GG)/)?.[1]||'';
    const row=direct.find(x=>x[3]===prefix)||direct.find(x=>!x[3])||direct[0];
    return {code:qu,tcgdexId:row[0],pokemonId:row[1],name:row[2],lang:'en',entry:null};
  }

  await zcLoadGlobalCatalog(false);

  // First: exact id/code/name/alias, preferring selected language chain.
  const preferred=[...zcLanguageChain(),...ZC_ALL_TCGDEX_LANGS.filter(x=>!zcLanguageChain().includes(x))];
  const matches=ZC_GLOBAL_CATALOG.filter(e=>
    zcCatalogAliases(e).some(a=>String(a).toUpperCase()===qu || zcCatalogNorm(a)===qn)
  );
  if(matches.length){
    matches.sort((a,b)=>{
      const gallery=String(cardNumber||'').toUpperCase().match(/^(TG|GG)/)?.[1]||'';
      const galleryScore=e=>{
        const text=zcCatalogNorm(`${e.id||''} ${e.name||''}`);
        const isTG=/trainer gallery|tg$/.test(text);
        const isGG=/galarian gallery|gg$/.test(text);
        if(gallery==='TG')return isTG?0:2;
        if(gallery==='GG')return isGG?0:2;
        return (isTG||isGG)?1:0;
      };
      const ag=galleryScore(a),bg=galleryScore(b);
      if(ag!==bg)return ag-bg;
      const aOfficial=String(a.ptcgoCode||'').toUpperCase()===qu?0:1;
      const bOfficial=String(b.ptcgoCode||'').toUpperCase()===qu?0:1;
      if(aOfficial!==bOfficial)return aOfficial-bOfficial;
      return preferred.indexOf(a.lang)-preferred.indexOf(b.lang);
    });
    const hit=matches[0];
    const pairedTcgdex=hit.source==='tcgdex'?hit:ZC_GLOBAL_CATALOG.find(e=>
      e.source==='tcgdex' &&
      zcCatalogNorm(e.name||'')===zcCatalogNorm(hit.name||'') &&
      (e.lang===hit.lang || (hit.lang==='en'&&e.lang==='en'))
    );
    return {
      code:qu,
      tcgdexId:pairedTcgdex?.id||(hit.source==='pokemontcg'?zcTcgdexIdFromPokemonId(hit.id):''),
      pokemonId:hit.source==='pokemontcg'?hit.id:'',
      name:hit.name,
      lang:hit.lang,
      entry:hit
    };
  }

  // Second: unique contains/name match for full set names.
  const fuzzy=ZC_GLOBAL_CATALOG.filter(e=>{
    const n=zcCatalogNorm(e.name);
    return n===qn || (qn.length>=4 && (n.includes(qn)||qn.includes(n)));
  });
  if(fuzzy.length===1){
    const hit=fuzzy[0];
    return {code:qu,tcgdexId:hit.source==='tcgdex'?hit.id:'',pokemonId:hit.source==='pokemontcg'?hit.id:'',name:hit.name,lang:hit.lang,entry:hit};
  }

  // Third: direct TCGdex ID probing across all locales. This catches newly published
  // Asian set IDs even before our 12h catalog cache refreshes.
  for(const lang of [...new Set([...zcLanguageChain(),...ZC_ALL_TCGDEX_LANGS])]){
    for(const id of [...new Set([q,q.toLowerCase(),q.toUpperCase()])]){
      try{
        const s=await zcFetchJson(`https://api.tcgdex.net/v2/${lang}/sets/${encodeURIComponent(id)}`,7000);
        if(s?.id){
          return {code:qu,tcgdexId:s.id,pokemonId:'',name:s.name||s.id,lang,entry:{source:'tcgdex',lang,id:s.id,name:s.name||s.id}};
        }
      }catch(e){}
    }
  }

  // Finally refresh once and retry exact match. This makes brand-new sets appear
  // without waiting for the cache to expire.
  await zcLoadGlobalCatalog(true);
  const fresh=ZC_GLOBAL_CATALOG.find(e=>zcCatalogAliases(e).some(a=>String(a).toUpperCase()===qu || zcCatalogNorm(a)===qn));
  if(fresh)return {code:qu,tcgdexId:fresh.source==='tcgdex'?fresh.id:'',pokemonId:fresh.source==='pokemontcg'?fresh.id:'',name:fresh.name,lang:fresh.lang,entry:fresh};

  return null;
}
const ZC_DYNAMIC_SET_CACHE=new Map();

function zcNormSetName(v=''){
  return String(v).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'')
    .replace(/[^a-z0-9]+/g,' ').trim();
}

async function zcResolveUnknownSetCode(code){
  const upper=zcClean(code).toUpperCase();
  if(!upper)return null;
  if(SET_CODE_TO_ID[upper])return {code:upper,tcgdexId:SET_CODE_TO_ID[upper],pokemonId:'',lang:null};
  return await zcResolveSetFromCatalog(code);
}

async function zcAttachPokemonFallback(card,parsed){
  try{
    const setId=card?.pokemonSetId||parsed?.pokemonSetId||parsed?.setId||card?.setId||'';
    const num=card?.number||parsed?.number||'';
    if(!setId||!num)return card;
    const q=`set.id:${setId} number:${num}`;
    const d=await zcFetchJson(`https://api.pokemontcg.io/v2/cards?q=${encodeURIComponent(q)}&pageSize=10`);
    const hit=(d.data||[]).find(x=>zcNormNumber(x.number||'')===zcNormNumber(num))||(d.data||[])[0];
    if(!hit)return card;
    const imgs=[hit.images?.small,hit.images?.large].filter(Boolean);
    card.imageCandidates=[...new Set([...(card.imageCandidates||[]),...imgs])];
    if(!card.image&&imgs[0])card.image=imgs[0];
    card.pokemonSetId=hit.set?.id||setId;
    if(hit.tcgplayer?.prices)card.tcgplayerPricing=hit.tcgplayer.prices;
  }catch(e){}
  return card;
}
const ZC_TCGCSV_CACHE=new Map();
let ZC_USD_EUR_RATE=null;
async function zcUsdEurRate(){
  if(Number.isFinite(ZC_USD_EUR_RATE))return ZC_USD_EUR_RATE;
  try{
    const d=await zcFetchJson('https://api.frankfurter.app/latest?from=USD&to=EUR',6000);
    const n=Number(d?.rates?.EUR);
    if(Number.isFinite(n)&&n>0)ZC_USD_EUR_RATE=n;
  }catch(e){}
  return Number.isFinite(ZC_USD_EUR_RATE)?ZC_USD_EUR_RATE:.86;
}
function zcTcgcsvNumber(product){
  const row=(product?.extendedData||[]).find(x=>zcNormText(x?.name)==='number');
  return zcNormCardNumber(String(row?.value||'').split('/')[0]);
}
function zcTcgcsvVariantLabel(product,price){
  const name=zcNormText(product?.name||'');
  if(name.includes('master ball'))return 'Master Ball';
  if(name.includes('great ball'))return 'Great Ball';
  if(name.includes('poke ball'))return 'Poké Ball';
  if(name.includes('pokemon together'))return 'Pokémon Together stamp';
  if(name.includes('snowflake'))return 'Snowflake stamp';
  if(name.includes('play pokemon'))return 'Play! Pokémon stamp';
  if(name.includes('pokemon center'))return 'Pokémon Center stamp';
  if(name.includes('prerelease')||name.includes('pre release'))return 'Prerelease stamp';
  if(name.includes('staff'))return 'Staff stamp';
  const subtype=zcNormText(price?.subTypeName||'');
  if(subtype.includes('reverse'))return 'Reverse Holo';
  if(subtype.includes('holo'))return 'Holo';
  return 'Basic / Normaal';
}
async function zcTcgcsvGroup(category,setCode,setName){
  const key=`groups:${category}`;
  let groups=ZC_TCGCSV_CACHE.get(key);
  if(!groups){groups=zcFetchJson(`https://tcgcsv.com/tcgplayer/${category}/groups`,12000).then(d=>d?.results||[]).catch(()=>[]);ZC_TCGCSV_CACHE.set(key,groups)}
  groups=await groups;
  const code=String(setCode||'').trim().toLowerCase(),name=zcNormSetName(setName||'');
  return groups.find(g=>String(g.abbreviation||'').trim().toLowerCase()===code)
    ||groups.find(g=>name&&zcNormSetName(g.name||'').includes(name))
    ||null;
}
async function zcAttachTcgcsv(card,parsed){
  try{
    const language=document.getElementById('language')?.value||'English';
    const category=language==='Japanese'?85:3;
    const group=await zcTcgcsvGroup(category,parsed?.setCode||card?.setCode||card?.setId,parsed?.resolvedSetName||card?.set);
    if(!group)return card;
    const key=`set:${category}:${group.groupId}`;
    let data=ZC_TCGCSV_CACHE.get(key);
    if(!data){
      data=Promise.all([
        zcFetchJson(`https://tcgcsv.com/tcgplayer/${category}/${group.groupId}/products`,14000),
        zcFetchJson(`https://tcgcsv.com/tcgplayer/${category}/${group.groupId}/prices`,14000)
      ]).then(([p,r])=>({products:p?.results||[],prices:r?.results||[]})).catch(()=>({products:[],prices:[]}));
      ZC_TCGCSV_CACHE.set(key,data);
    }
    data=await data;
    const number=zcNormCardNumber(card?.number||parsed?.number||'');
    const products=data.products.filter(p=>zcTcgcsvNumber(p)===number);
    if(!products.length)return card;
    const ids=new Set(products.map(p=>p.productId));
    const byId=new Map(products.map(p=>[p.productId,p]));
    const rate=await zcUsdEurRate(),variants={};
    for(const price of data.prices){
      if(!ids.has(price.productId))continue;
      const market=Number(price.marketPrice),mid=Number(price.midPrice),low=Number(price.lowPrice);
      const reference=Number.isFinite(market)&&market>0?market:(Number.isFinite(mid)&&mid>0?mid:null);
      const reliableLow=Number.isFinite(low)&&low>0&&(reference==null||low>=reference*.45)?low:null;
      const usd=reliableLow!=null&&reference!=null?(Math.min(reliableLow,reference)+reference)/2:(reference??reliableLow);
      if(!Number.isFinite(usd)||usd<=0)continue;
      const label=zcTcgcsvVariantLabel(byId.get(price.productId),price);
      const previous=variants[label];
      if(!previous||usd>previous.usd)variants[label]={usd,eur:usd*rate,productId:price.productId};
    }
    card.tcgcsvVariants=variants;
    card.tcgcsvDefaultVariant=variants['Basic / Normaal']?'Basic / Normaal':Object.keys(variants)[0]||'';
  }catch(e){}
  return card;
}
async function zcAttachFallbacksToCards(cards,parsed){
  // Show complete TCGdex results immediately. Extra images and variant prices
  // are enriched in the background and must never block a normal search.
  for(const c of cards||[]){

      if(selectedCard?.id===c.id){zcSyncVariantOptions(c);renderDetail()}
    }).catch(()=>{});
  }
  return cards||[];
}

async function zcAttachTcgdexMarket(card,parsed){
  try{
    let full=null;
    // If TCGdex set ID is known, direct card lookup is best.
    if(parsed?.setId&&card?.number){
      const candidate=await zcTcgdexCardById(parsed.setId,card.number);
      if(candidate && zcExactIdentityMatch(
        {name:card.name,number:card.number,set:card.set},
        {name:candidate.name,number:candidate.localId||candidate.number,set:candidate.set?.name||candidate.set||card.set}
      )) full=candidate;
    }
    // Otherwise search by name + number.
    if(!full){
      const params=new URLSearchParams();
      if(card?.name)params.set('name',card.name);
      if(card?.number)params.set('localId',card.number);
      params.set('pagination:page','1');
      params.set('pagination:itemsPerPage','20');
      for(const lang of zcLanguageChain()){
        try{
          const list=await zcFetchJson(`https://api.tcgdex.net/v2/${lang}/cards?${params}`);
          if(Array.isArray(list)&&list.length){
            const brief=list.find(x=>zcNormNumber(x.localId||'')===zcNormNumber(card.number||'') && (!card.name||zcNormText(x.name||'')===zcNormText(card.name||'')))||null;
            if(!brief)continue;
            const candidate=await zcTcgdexFullCard(brief.id,lang)||brief;
            if(candidate && zcExactIdentityMatch({name:card.name,number:card.number,set:card.set}, {name:candidate.name,number:candidate.localId||candidate.number,set:candidate.set?.name||candidate.set||''})){
              full=candidate;
              break;
            }
          }
        }catch(e){}
      }
    }
    if(full){
      card.tcgdexPricing=full.pricing?.cardmarket||null;
      card.tcgplayerPricing=full.pricing?.tcgplayer||card.tcgplayerPricing||null;
      card.variantsDetailed=zcVariantsDetailed(full);
      const avg=zcAvg30ForSelection(card,document.getElementById('variant')?.value||'Standard');
      card.prices={...zcNoPrice(),average30Days:avg,source:avg!=null?'TCGdex Europese marktfeed – gemiddeld 30 dagen':'unavailable',isReal:avg!=null};
    }
  }catch(e){}
  return card;
}
async function zcAttachMarketToCards(cards,parsed){
  const enriched=await Promise.all((cards||[]).map(c=>zcAttachTcgdexMarket(c,parsed)));
  return await zcAttachFallbacksToCards(enriched,parsed);
}


async function zcGlobalCardSearch(parsed,rarity){
  const out=[];
  const seen=new Set();
  const primaryLangs=[...new Set([
    ...(parsed.preferredLang?[parsed.preferredLang]:[]),
    ...zcLanguageChain()
  ])];
  const langs=[...new Set([
    ...primaryLangs,
    ...ZC_ALL_TCGDEX_LANGS
  ])];

  // If a set is resolved, direct exact lookup is the most reliable.
  if(parsed.setId&&parsed.number){
    const oldChain=zcLanguageChain;
    for(const lang of primaryLangs){
      try{
        const raw=String(parsed.number).trim();
        const nums=[raw,raw.toUpperCase(),zcNormNumber(raw)];
        if(/^\d+$/.test(raw)){
          const p=String(parseInt(raw,10));
          nums.push(p,p.padStart(2,'0'),p.padStart(3,'0'));
        }
        const promoPrefix={swshp:'SWSH',smp:'SM',xyp:'XY',bwp:'BW',dpp:'DP',np:'NP'}[String(parsed.setId).toLowerCase()];
        if(promoPrefix&&/^\d+$/.test(raw)){
          const p=String(parseInt(raw,10));
          nums.push(promoPrefix+p,promoPrefix+p.padStart(2,'0'),promoPrefix+p.padStart(3,'0'));
        }
        for(const n of [...new Set(nums)]){
          try{
            const c=await zcFetchJson(`https://api.tcgdex.net/v2/${lang}/cards/${encodeURIComponent(parsed.setId+'-'+n)}`,6500);
            if(c?.id){
              if(parsed.name && zcNormText(c.name)!==zcNormText(parsed.name) && !zcNormText(c.name).includes(zcNormText(parsed.name)))continue;
              if(rarity && zcNormText(c.rarity)!==zcNormText(rarity))continue;
              const r=zcTcgdexToResult(c);
              if(!seen.has(r.id)){seen.add(r.id);out.push(r)}
              return out;
            }
          }catch(e){}
        }
      }catch(e){}
    }
  }

  // Set-level lookup is efficient and supports promos/specials.
  if(parsed.setId){
    for(const lang of primaryLangs){
      try{
        const s=await zcFetchJson(`https://api.tcgdex.net/v2/${lang}/sets/${encodeURIComponent(parsed.setId)}`,15000);
        if(!s?.cards?.length)continue;
        let list=s.cards.filter(c=>{
          const numOK=!parsed.number||zcNormCardNumber(c.localId||'')===zcNormCardNumber(parsed.number);
          const nameOK=!parsed.name||zcNormText(c.name||'').includes(zcNormText(parsed.name));
          return numOK&&nameOK;
        }).slice(0,20);
        const detailed=await Promise.all(list.map(async brief=>{
          try{return await zcFetchJson(`https://api.tcgdex.net/v2/${lang}/cards/${encodeURIComponent(brief.id)}`,9000)||brief}
          catch(e){return brief}
        }));
        for(const c of detailed){
          if(rarity&&c.rarity&&zcNormText(c.rarity)!==zcNormText(rarity))continue;
          const r=zcTcgdexToResult({...c,set:c.set||s});
          if(!seen.has(r.id)){seen.add(r.id);out.push(r)}
        }
        if(out.length)return out;
      }catch(e){}
    }
  }

  // Global name/number search across locales. This also finds cards from sets whose
  // code the user did not know, including galleries and regional special sets.
  for(const lang of langs){
    const qs=new URLSearchParams();
    if(parsed.name)qs.set('name',parsed.name);
    if(parsed.number)qs.set('localId',parsed.number);
    qs.set('pagination:page','1');
    qs.set('pagination:itemsPerPage','50');
    try{
      const list=await zcFetchJson(`https://api.tcgdex.net/v2/${lang}/cards?${qs}`,8000);
      if(!Array.isArray(list)||!list.length)continue;
      for(const brief of list.slice(0,30)){
        try{
          const full=await zcFetchJson(`https://api.tcgdex.net/v2/${lang}/cards/${encodeURIComponent(brief.id)}`,6500);
          const c=full?.id?full:brief;
          if(parsed.number&&zcNormCardNumber(c.localId||c.number||'')!==zcNormCardNumber(parsed.number))continue;
          if(parsed.name&&!zcNormText(c.name||'').includes(zcNormText(parsed.name)))continue;
          if(parsed.setQuery){
            const setText=zcNormText(c.set?.name||c.set?.id||'');
            const q=zcCatalogNorm(parsed.setQuery);
            const idText=String(c.set?.id||'').toUpperCase();
            const resolvedId=String(parsed.setId||parsed.pokemonSetId||'').toUpperCase();
            const resolvedName=zcNormText(parsed.resolvedSetName||'');
            if(idText!==String(parsed.setQuery).toUpperCase() && idText!==resolvedId && (!resolvedName||!setText.includes(resolvedName)) && !setText.includes(q))continue;
          }
          if(rarity&&zcNormText(c.rarity||'')!==zcNormText(rarity))continue;
          const r=zcTcgdexToResult(c);
          if(!seen.has(r.id)){seen.add(r.id);out.push(r)}
          if(out.length>=18)return out;
        }catch(e){}
      }
    }catch(e){}
  }

  return out;
}

async function zcSearchDirect(rawName,rawSet,rawNumber,rarity){
  let parsed=zcParseSearch(rawName,rawSet,rawNumber);

  // Resolve every set dynamically. No hardcoded current-set list is required anymore.
  if(parsed.setQuery){
    const r=await zcResolveSetFromCatalog(parsed.setQuery,parsed.number);
    if(r){
      parsed.setId=r.tcgdexId||parsed.setId||'';
      parsed.pokemonSetId=r.pokemonId||'';
      parsed.preferredLang=r.lang||null;
      parsed.resolvedSetName=r.name||'';

      // If catalog hit only came from Pokémon TCG API, find the same set in TCGdex by name.
      if(!parsed.setId && r.name){
        const r2=await zcResolveSetFromCatalog(r.name,parsed.number);
        if(r2?.tcgdexId){
          parsed.setId=r2.tcgdexId;
          parsed.preferredLang=r2.lang||parsed.preferredLang;
        }
      }
    }
  }

  if(!parsed.name&&!parsed.setQuery&&!parsed.number)return[];

  // Global multilingual TCGdex search is the primary source for all languages,
  // promos, galleries, regional specials and new releases.
  const strictSetFilter=cards=>(cards||[]).filter(card=>{
    if(!parsed.setQuery)return true;
    const wantedIds=[parsed.setId,parsed.pokemonSetId].filter(Boolean).map(x=>String(x).toLowerCase());
    const cardIds=[card.setId,card.pokemonSetId].filter(Boolean).map(x=>String(x).toLowerCase());
    if(wantedIds.some(id=>cardIds.includes(id)))return true;
    const wantedName=zcNormSetName(parsed.resolvedSetName||'');
    return !!wantedName && zcNormSetName(card.set||'')===wantedName;
  });

  let cards=strictSetFilter(await zcGlobalCardSearch(parsed,rarity));

  // Combine the English fallback with the primary result instead of stopping
  // after the first hit. This keeps every printing from the requested set,
  // such as MEW 006, 183 and 199.
  let fallbackCards=[];
  if(!cards.length || (zcSelectedLanguage()==='English'&&!parsed.number&&cards.length===1)){
    fallbackCards=strictSetFilter(await zcPokemonFallback(parsed,rarity));
  }
  const identity=c=>`${zcNormText(c.name||'')}|${zcNormCardNumber(c.number||'')}`;
  const existing=new Set(cards.map(identity));
  const missing=fallbackCards.filter(c=>!existing.has(identity(c)));
  if(cards.length||missing.length){
    const primary=cards.length?await zcAttachFallbacksToCards(cards,parsed):[];
    const secondary=missing.length?await zcAttachMarketToCards(missing,parsed):[];
    return [...primary,...secondary].sort((a,b)=>String(a.number||'').localeCompare(String(b.number||''),undefined,{numeric:true,sensitivity:'base'}));
  }

  // Existing manually curated emergency fallback remains last.
  const localCards=zcLocalNewSetSearch(parsed,rarity);
  if(localCards.length)return localCards;

  return [];
}


function zcValidateCardPricing(card){
  if(!card)return card;
  const variant=document.getElementById('variant')?.value||'Standard';
  const safe=zcSafeAvg30(card,variant);
  const current=zcCurrentMarketForSelection(card,variant);
  card.prices={...(card.prices||zcNoPrice()),average30Days:safe,currentMarket:current,isReal:current!=null||safe!=null};
  if(safe==null){
    card.prices.source='unavailable';
  }
  return card;
}
function zcValidateCards(cards){
  return (cards||[]).map(zcValidateCardPricing);
}

async function searchCards(e){
  e?.preventDefault();
  $('detailPanel').innerHTML='<div class="placeholder">Wereldwijde kaartdatabase doorzoeken…</div>';
  $('resultsStrip').innerHTML='';
  try{
    currentCards=zcValidateCards(await zcSearchDirect($('q').value,$('set').value,$('number').value,$('rarity').value));
    selectedCard=currentCards[0]||null;
    if(selectedCard)zcSyncVariantOptions(selectedCard);
    renderStrip();renderDetail();
    if(!currentCards.length)showToast('Geen kaart gevonden. Controleer setcode, taal en kaartnummer. Voor zeer nieuwe sets wordt ook een aanvullende setindex gebruikt.')
  }catch(err){
    console.error(err);
    $('detailPanel').innerHTML='<div class="placeholder"><strong>Zoeken mislukt.</strong><br>De kaartdatabase kon niet worden bereikt. Probeer opnieuw.</div>'
  }
}

function details(){return{variant:$('variant').value,language:$('language').value,condition:$('condition').value,graded:$('graded').value==='yes',gradingCompany:$('graded').value==='yes'?$('gradingCompany').value:null,grade:$('graded').value==='yes'?$('grade').value:null}}
function addSelectedCard(){
  const c=selectedCard;
  if(!c){showToast('Geen kaart geselecteerd.');return}
  addFav(c.id);
}
function addFav(id){
  const c=(selectedCard&&(!id||selectedCard.id===id))?selectedCard:(currentCards.find(x=>x.id===id)||selectedCard);
  if(!c){showToast('Geen kaart geselecteerd.');return}
  const d=details();
  const best=zcBestVisiblePrice(c,d.variant);
  const avg=zcAvg30ForSelection(c,d.variant);
  const prices={...(c.prices||zcNoPrice()),average30Days:avg,currentMarket:(best.currency==='EUR'?best.value:null),fallbackMarket:best.value,fallbackCurrency:best.currency,fallbackLabel:best.label};
  const listId=[c.id,d.variant,d.language,d.condition,d.graded?d.gradingCompany+d.grade:'raw'].join('|');
  const favs=store.favs;
  const old=favs.find(x=>x.listId===listId);
  if(old)old.quantity=Math.max(1,Number(old.quantity)||1)+1;
  else favs.push({...c,prices,...d,listId,quantity:1});
  store.favs=favs;
  renderFavorites();
  showToast('Kaart toegevoegd aan jouw kaartenlijst.');
}
function changeQty(id,delta){const favs=store.favs,item=favs.find(x=>(x.listId||x.id)===id);if(!item)return;item.quantity=Math.max(1,(Number(item.quantity)||1)+delta);store.favs=favs;renderFavorites()}
function removeFav(id){store.favs=store.favs.filter(x=>(x.listId||x.id)!==id);renderFavorites()}
function renderFavorites(){const f=store.favs.map(x=>({...x,quantity:Math.max(1,Number(x.quantity)||1)})),priceOf=x=>{const v=x.prices?.currentMarket ?? x.prices?.average30Days;return(v===null||v===undefined||!Number.isFinite(Number(v)))?null:Number(v)},visible=x=>{const a=priceOf(x);if(a!=null)return{v:a,c:'EUR',label:x.prices?.currentMarket!=null?'actuele marktwaarde':'gemiddeld 30 dagen'};const v=x.prices?.fallbackMarket,c=x.prices?.fallbackCurrency||'USD';return(v===null||v===undefined||!Number.isFinite(Number(v)))?{v:null,c:'EUR',label:'geen prijsdata'}:{v:Number(v),c,label:'actuele marktprijs'}},totalQty=f.reduce((s,x)=>s+x.quantity,0),total=f.reduce((s,x)=>{const v=priceOf(x);return s+(v===null?0:v*x.quantity)},0);$('uniqueCount').textContent=f.length;$('favCount').textContent=totalQty;$('totalQty').textContent=totalQty;$('grandTotal').textContent=euro(total);$('eightyTotal').textContent=euro(total*.8);$('favorites').innerHTML=f.length?f.map(x=>{const p=visible(x),totalItem=p.v===null?null:p.v*x.quantity;return `<div class="mini">${imageTag(x)}<div><h3>${esc(x.name)}</h3><div class="mini-meta">${esc(x.number)} · ${esc(x.variant||'Standard')}<br>${esc(x.language||'English')} · ${x.graded?esc((x.gradingCompany||'PSA')+' '+(x.grade||'10')):esc(x.condition||'Near Mint')}</div></div><div class="mini-right"><div><strong>${p.v===null?'Niet beschikbaar':money(p.v,p.c)}</strong><small>${p.label}${p.c==='USD'?' · USD':''}</small>${p.v===null?'':`<div class="item-eighty">80%: ${money(p.v*.8,p.c)}</div>`}</div><div class="qty"><button class="btn sm" onclick="changeQty('${esc(x.listId||x.id)}',-1)">−</button><span>${x.quantity}x</span><button class="btn sm" onclick="changeQty('${esc(x.listId||x.id)}',1)">+</button><button class="btn danger sm" onclick="removeFav('${esc(x.listId||x.id)}')">×</button></div><div class="item-total">Totaal: ${totalItem===null?'Niet beschikbaar':money(totalItem,p.c)}</div></div></div>`}).join(''):'<div class="empty-list">Nog geen kaarten toegevoegd.</div>'}
function openAlert(id){selectedAlertCard=currentCards.find(x=>x.id===id)||selectedCard;if(!selectedAlertCard)return;$('alertCardName').textContent=selectedAlertCard.name+' – huidige trendprijs '+euro(selectedAlertCard.prices?.trendPrice);$('alertModal').classList.add('open')}
function closeAlert(){$('alertModal').classList.remove('open');selectedAlertCard=null;$('alertTarget').value=''}
$('saveAlert').onclick=()=>{if(!selectedAlertCard||!$('alertTarget').value)return;const a=store.alerts.filter(x=>x.id!==selectedAlertCard.id);a.unshift({id:selectedAlertCard.id,name:selectedAlertCard.name,target:Number($('alertTarget').value),current:selectedAlertCard.prices?.trendPrice});store.alerts=a;closeAlert();showToast('Prijsalarm opgeslagen in deze browser.')}
function showToast(t){const e=$('toast');e.textContent=t;e.classList.add('show');clearTimeout(showToast.t);showToast.t=setTimeout(()=>e.classList.remove('show'),2800)}
$('variant').addEventListener('change',()=>{if(selectedCard)renderDetail();});
$('graded').addEventListener('change',()=>$('gradingOptions').classList.toggle('show',$('graded').value==='yes'));$('searchForm').addEventListener('submit',searchCards);$('clearSearch').onclick=()=>{['q','set','number'].forEach(id=>$(id).value='');$('series').value='';$('rarity').value='';$('variant').value='Automatisch';$('language').value='English';$('condition').value='Near Mint';$('graded').value='no';$('gradingOptions').classList.remove('show');$('q').focus()};$('clearAll').onclick=()=>{if(confirm('Weet je zeker dat je de hele kaartenlijst wilt leegmaken?')){store.favs=[];renderFavorites()}};
